modules:
  jira:globalPage:
    - key: hello-world-global-page
      resource: main
      resolver:
        function: resolver
      title: hello-world
      layout: native
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: static/hello-world/build
    tunnel:
      port: 3000
permissions:
  scopes:
    - read:jira-work
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/8f4b60d2-1fac-4743-9851-d5cf44ce8f90
